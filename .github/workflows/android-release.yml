name: Android Production Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    environment: android-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate tag and Android version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#android-v}"
          actual="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" mobile/android/app/build.gradle)"
          test "$expected" = "$actual" || { echo "Tag $expected does not match versionName $actual"; exit 1; }
      - name: Restore protected production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALLOWANCE_OS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ALLOWANCE_OS_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/allowance-os-release.jks"
      - name: Test and build production APK
        working-directory: mobile/android
        env:
          ALLOWANCE_OS_STORE_FILE: ${{ runner.temp }}/allowance-os-release.jks
          ALLOWANCE_OS_STORE_PASSWORD: ${{ secrets.ALLOWANCE_OS_STORE_PASSWORD }}
          ALLOWANCE_OS_KEY_ALIAS: ${{ secrets.ALLOWANCE_OS_KEY_ALIAS }}
          ALLOWANCE_OS_KEY_PASSWORD: ${{ secrets.ALLOWANCE_OS_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify APK signature
        run: apksigner verify --verbose --print-certs mobile/android/app/build/outputs/apk/release/*.apk
      - name: Generate checksum
        working-directory: mobile/android/app/build/outputs/apk/release
        run: sha256sum *.apk > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          args=(--title "Allowance OS Android ${GITHUB_REF_NAME#android-v}")
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            mobile/android/app/build/outputs/apk/release/*.apk \
            mobile/android/app/build/outputs/apk/release/SHA256SUMS.txt \
            "${args[@]}"
