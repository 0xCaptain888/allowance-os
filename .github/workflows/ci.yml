name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  solana-program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo test

  solana-sbf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned SBF builder
        run: cargo install cargo-build-sbf --version 4.3.0 --locked
      - name: Build deployable Program artifact
        run: cargo-build-sbf --manifest-path program/Cargo.toml
      - name: Record artifact digest
        run: sha256sum program/target/deploy/allowance_os_program.so
      - uses: actions/upload-artifact@v7
        with:
          name: allowance-os-program-v2-sbf
          path: program/target/deploy/allowance_os_program.so
          if-no-files-found: error

  android-mwa-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: allowance-os-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
